<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<header class="top">
  <div class="brand"><span class="logo">A</span><b>ApplyPilot</b></div>
  <button id="gear" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<section id="settings" class="card hidden">
  <label>API URL<input id="api" placeholder="https://your-app.vercel.app"></label>
  <label>Extension token <small>(from Dashboard)</small><input id="token" placeholder="paste token"></label>
  <label>Resume PDF <small>(for file uploads)</small><input id="resume" type="file" accept="application/pdf"></label>
  <label>Standard answers <small>(used when a form asks)</small><textarea id="answers" rows="5" placeholder="Notice period: 0 days, can join immediately
Years with tools not in my resume: 0
Willing to relocate: Yes
Authorized to work in India: Yes
Expected CTC: (leave out to be asked each time)"></textarea></label>
  <button id="save" class="btn primary">Save settings</button>
</section>

<section id="job" class="card">
  <div class="muted xs">This page</div>
  <div id="jobTitle" class="title"><span class="skel w70"></span></div>
  <div id="jobCompany" class="muted sm"><span class="skel w40"></span></div>
  <div id="team" class="team"></div>
</section>

<button id="quick" class="btn primary block">⚡ One-click Apply</button>
<label class="toggle muted sm"><input type="checkbox" id="autoSubmit"> Auto-submit when every answer is filled <small>(LinkedIn Easy Apply, Naukri, Indeed)</small></label>
<button id="fill" class="btn block">Fill this page only</button>
<details class="card" id="apBox">
  <summary>🤖 Autopilot <small class="muted">(LinkedIn Easy Apply)</small></summary>
  <div class="muted xs" style="margin:6px 0 8px">Open LinkedIn Jobs, search a role, turn on the Easy Apply filter, then press Start. It applies to strong matches one by one and saves the rest to your Tracker.</div>
  <div class="grid2">
    <label>Min match %<input id="apMin" type="number" min="0" max="100" value="70"></label>
    <label>Max per day<input id="apCap" type="number" min="1" max="50" value="25"></label>
  </div>
  <button id="autopilot" class="btn primary block">Start Autopilot</button>
</details>
<div class="grid2">
  <button id="saveJob" class="btn">Save job</button>
  <button id="referral" class="btn">Write referral note</button>
</div>
<details class="card" id="hrBox">
  <summary>Find HR contact</summary>
  <label>Company domain<input id="domain" placeholder="e.g. razorpay.com"></label>
  <button id="findHr" class="btn block">Find HR (free)</button>
</details>

<div id="status" class="status" role="status"></div>
<div id="out"></div>
<footer id="foot" class="muted xs">Auto-submit is off: you review the last step and press Submit.</footer>
<script src="popup.js"></script>
</body></html>
